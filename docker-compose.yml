services:
  database:
    image: ghcr.io/skywishky/cappoensixdellelys-database:latest
    container_name: tamagotchi-db-frontdev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tamagochi}
      POSTGRES_USER: ${POSTGRES_USER:-tamagochi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tamagochi_secret}
    ports:
      - '5432:5432'
    volumes:
      - pgdata_frontdev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tamagochi} -d ${POSTGRES_DB:-tamagochi}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tamagotchi_net

  back:
    image: ghcr.io/skywishky/cappoensixdellelys-back:latest
    container_name: tamagotchi-back-frontdev
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-tamagochi}
      DB_USER: ${POSTGRES_USER:-tamagochi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tamagochi_secret}
      SERVER_PORT: 8080
      PET_DECAY_INTERVAL: 10000
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tamagotchi_net

  front:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/skywishky/cappoensixdellelys-front:local
    container_name: tamagotchi-front-local
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
    environment:
      PORT: 80
      BACKEND_URL: http://back:8080
    ports:
      - '4200:80'
    networks:
      - tamagotchi_net

volumes:
  pgdata_frontdev:

networks:
  tamagotchi_net:
    driver: bridge
